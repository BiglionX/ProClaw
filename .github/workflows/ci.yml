name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========================================================
  # Hermes 快速反馈(单测 + 类型检查,PR 必跑)
  # ========================================================
  hermes-fast:
    name: Hermes · Fast Feedback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Hermes type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Hermes unit tests
        run: npx vitest run --reporter=verbose src/lib/hermes
      - name: Hermes coverage report
        if: success()
        run: npx vitest run --coverage --reporter=json src/lib/hermes > hermes-coverage.json 2>&1 || true

  # ========================================================
  # Frontend 全量 lint/test(继承)
  # ========================================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 || true

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [hermes-fast, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 全量 vitest(含 e2e 排除)
        run: npx vitest run --coverage --exclude='**/e2e/**' --reporter=verbose

  # ========================================================
  # Hermes 可视化组件 Storybook 构建(确保 stories 不坏)
  # ========================================================
  storybook-build:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: hermes-fast
    # 标记为可选:如果仓库尚未安装 Storybook,优雅跳过
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 检测 Storybook 是否安装
        id: detect
        run: |
          if [ -d "node_modules/@storybook" ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Storybook 未安装,跳过 build。参考 STORYBOOK_SETUP.md"
          fi
      - name: Build Storybook
        if: steps.detect.outputs.installed == 'true'
        run: npx storybook build --output-dir storybook-static
      - name: Upload Storybook 产物
        if: steps.detect.outputs.installed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  # ========================================================
  # Hermes 集成测试:端到端验证(可选,需要先 build main)
  # ========================================================
  hermes-integration:
    name: Hermes · Integration
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: 启动并等待 Vite Preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          echo $! > /tmp/vite-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "✓ Vite Preview 在 ${i} 秒内就绪"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/vite-preview.pid)" 2>/dev/null; then
              echo "::error::Vite Preview 进程提前退出"
              exit 1
            fi
            sleep 1
          done
          echo "::error::Vite Preview 在 30 秒内未就绪"
          exit 1
      - name: Hermes API smoke test
        run: |
          curl -sf http://127.0.0.1:4173/ > /dev/null
          curl -sf http://127.0.0.1:4173/assets/ 2>/dev/null || true
          echo "✓ Vite Preview 响应正常"
      - name: 校验 Hermes 模块编译产物
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: 清理后台进程
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true
            rm -f /tmp/vite-preview.pid
          fi

  # ========================================================
  # Rust 后端(确保 hermes_commands.rs 不破坏主编译)
  # ========================================================
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
        working-directory: src-tauri

  rust-clippy:
    name: Rust Clippy (Hermes-aware)
    runs-on: ubuntu-latest
    needs: rust-fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: mkdir -p dist && echo '<!DOCTYPE html><html><body></body></html>' > dist/index.html
      - name: 检查 hermes_commands 编译
        run: cargo check --tests --message-format=short
        working-directory: src-tauri
      - name: Clippy (所有警告视为错误,hermes_commands 模块自动覆盖)
        run: cargo clippy --all-targets -- -D warnings --message-format=short
        working-directory: src-tauri

  # ========================================================
  # 老系统三文件导入：建批次、落库、重复导入幂等
  # 样例在仓库根目录 test-old-date/，测试是 src-tauri/tests/e2e_import.rs
  # ========================================================
  rust-import-e2e:
    name: Rust Import E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: mkdir -p dist && echo '<!DOCTYPE html><html><body></body></html>' > dist/index.html
      - name: 三个老系统导出文件导入与重复导入
        working-directory: src-tauri
        run: cargo test --test e2e_import -- --nocapture --test-threads=1

  # ========================================================
  # Mobile(继承)
  # ========================================================
  mobile-lint:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile

  mobile-test:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest
    needs: mobile-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test -- --ci
        working-directory: mobile

  # ==================== Desktop installers ====================
  # 只在 push main、push tag v* 或手动触发时打未签名 NSIS/MSI。PR 跳过，不拉长门禁。
  # NSIS 与 WiX 由 Tauri CLI 自行下载。不改 tauri.conf.json 的 targets / identifier。
  # windows-latest 的 VS 18 让 node-gyp 编不过 better-sqlite3，固定 windows-2022。
  desktop-installers:
    name: Desktop Installers
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build unsigned NSIS and MSI
        run: npx tauri build --bundles nsis,msi
      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: ProClaw-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ProClaw-msi-${{ github.sha }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ========================================================
  # CI 完成总结
  # ========================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs:
      - hermes-fast
      - hermes-integration
      - storybook-build
      - frontend-lint
      - frontend-test
      - rust-fmt
      - rust-clippy
      - rust-import-e2e
      - mobile-lint
      - mobile-test
    if: always()
    steps:
      - name: 安装 jq
        run: sudo apt-get install -y jq
      - name: 输出 PR 评论摘要
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "## 🦞 ProClaw CI 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for job in hermes-fast hermes-integration storybook-build frontend-lint frontend-test rust-fmt rust-clippy rust-import-e2e mobile-lint mobile-test; do
            status=$(jq -r --arg job "$job" '.[$job].result // "unknown"' <<< "$NEEDS_JSON")
            emoji="✅"
            [ "$status" = "failure" ] && emoji="❌"
            [ "$status" = "cancelled" ] && emoji="⚪"
            [ "$status" = "skipped" ] && emoji="⏭️"
            [ "$status" = "unknown" ] && emoji="❓"
            echo "| $job | $emoji $status |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: 失败时评论 PR
        if: |
          failure() && github.event_name == 'pull_request' &&
          (needs.hermes-fast.result == 'failure' ||
           needs.hermes-integration.result == 'failure' ||
           needs.rust-clippy.result == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ CI 失败,请查看 Actions 日志。Hermes 相关问题优先关注 `hermes-fast` 与 `rust-clippy` 两个 job。'
            });
