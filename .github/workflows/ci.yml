name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==================== Frontend ====================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 || true

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage

  # ==================== Backend (Rust) ====================
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
        working-directory: src-tauri

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: mkdir -p dist && echo '<!DOCTYPE html><html><body></body></html>' > dist/index.html
      - run: cargo check --tests
        working-directory: src-tauri

  # ========================================================
  # 老系统三文件导入：建批次、落库、重复导入幂等
  # 样例在仓库根目录 test-old-date/，测试是 src-tauri/tests/e2e_import.rs
  # ========================================================
  rust-import-e2e:
    name: Rust Import E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: mkdir -p dist && echo '<!DOCTYPE html><html><body></body></html>' > dist/index.html
      - name: 三个老系统导出文件导入与重复导入
        working-directory: src-tauri
        run: cargo test --test e2e_import -- --nocapture --test-threads=1
      - name: Rust Lib Tests (key_manager serial)
        working-directory: src-tauri
        run: cargo test --locked --lib key_manager -- --test-threads=1
      - name: Rust Lib Tests (parallel)
        working-directory: src-tauri
        run: cargo test --locked --lib -- --skip key_manager
      - name: Rust Integration Tests
        working-directory: src-tauri
        run: cargo test --locked --test integration_test --test sales_outbound_test --test sales_return_test

  # ==================== Mobile (Expo + RN) ====================
  mobile-lint:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile

  mobile-test:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest
    needs: mobile-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test -- --ci
        working-directory: mobile

  # ==================== Desktop installers ====================
  # 只在 push main、push tag v* 或手动触发时打未签名 NSIS/MSI。PR 跳过，不拉长门禁。
  # NSIS 与 WiX 由 Tauri CLI 自行下载。不改 tauri.conf.json 的 targets / identifier。
  # windows-latest 的 VS 18 让 node-gyp 编不过 better-sqlite3，固定 windows-2022。
  desktop-installers:
    name: Desktop Installers
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build unsigned NSIS and MSI
        run: npx tauri build --bundles nsis,msi
      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: ProClaw-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ProClaw-msi-${{ github.sha }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
