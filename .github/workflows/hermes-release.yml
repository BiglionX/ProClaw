name: Hermes Release Notes

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  changelog:
    name: Generate Hermes CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 提取 Hermes 相关 commits
        id: extract
        run: |
          # 提取含 hermes/skill/moa/healing/evolve 关键字的 commits
          HERMES_COMMITS=$(git log --pretty=format:"- %s (%h)" \
            --grep="hermes" --grep="skill" --grep="evolve" --grep="moa" \
            --grep="healing" -i --since="30 days ago" | head -30)
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$HERMES_COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 🦞 Hermes Skills 更新

            ### 新增
            - 技能自进化引擎 (P0-B)
            - 多模型 MoA 委员会 (P1-B)

            ### 改进
            - Self-healing LLM 调用 (P1-A)
            - 技能可视化页面 (P2)

            ### 最近 Hermes 相关 commits
            ${{ steps.extract.outputs.commits }}
          draft: false
          prerelease: false

  changelog-pr:
    name: Comment CHANGELOG on PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 检测 Hermes 改动
        id: detect
        run: |
          HERMES_CHANGED=$(git diff --name-only origin/main...HEAD | grep -E "(hermes|skill|moa)" | wc -l)
          echo "changed=$HERMES_CHANGED" >> "$GITHUB_OUTPUT"
      - name: 评论 PR
        if: steps.detect.outputs.changed > 0
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = ${{ steps.detect.outputs.changed }};
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🦞 **Hermes 模块变更**(${changedFiles} 个文件)\n\n请确认:\n- [ ] Skill 数据结构兼容现有 schema\n- [ ] 没有破坏 `attachHermes` 契约\n- [ ] 更新了对应 stories 与 fixtures`
            });